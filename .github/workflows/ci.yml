name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The full workspace, on the only platform it currently supports. The broker's
  # transport is named pipes and its caller identification is a Win32 call, so
  # there is no Linux build of this to run yet.
  workspace:
    name: Workspace (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # tauri-build reads the frontend bundle, so the desktop crate does not
      # compile until this has run. It doubles as the TypeScript typecheck.
      - name: Build frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: cargo test --workspace

  # Two crates that must build away from Windows, for different reasons.
  #
  # yara-core claims to be free of platform and UI entanglement, and that claim
  # is what keeps the part worth auditing small — a claim nothing enforces
  # decays, so this is what enforces it.
  #
  # yara-sync is the opposite case: Linux is where it actually runs, and the
  # Windows job proves nothing about the binary that ends up on the server.
  linux:
    name: Core and sync (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy -p yara-core -p yara-sync --all-targets -- -D warnings

      - run: cargo test -p yara-core -p yara-sync

  supply-chain:
    name: Advisories and licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources
