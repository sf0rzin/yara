name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The full workspace, on the only platform it currently supports. The broker's
  # transport is named pipes and its caller identification is a Win32 call, so
  # there is no Linux build of this to run yet.
  workspace:
    name: Workspace (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # tauri-build reads the frontend bundle, so the desktop crate does not
      # compile until this has run. It doubles as the TypeScript typecheck.
      - name: Build frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build

      - run: cargo fmt --all --check

      - run: cargo clippy --workspace --all-targets -- -D warnings

      - run: cargo test --workspace

  # yara-core claims to be free of platform and UI dependencies. This is what
  # keeps that claim true: the day something reaches for a Win32 call or the
  # filesystem in there, this job goes red.
  core-portable:
    name: Core (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy -p yara-core --all-targets -- -D warnings

      - run: cargo test -p yara-core

  supply-chain:
    name: Advisories and licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories licenses sources
