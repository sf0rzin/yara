name: CI

on:
  push:
    branches: [main]
  pull_request:

# Nothing here publishes anything, so nothing here needs a token that could.
# The default grant is write, and it applies to a workflow that runs on every
# pull request — including one from a fork.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # The full workspace, on the only platform it currently supports. The broker's
  # transport is named pipes and its caller identification is a Win32 call, so
  # there is no Linux build of this to run yet.
  workspace:
    name: Workspace (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      # tauri-build reads the frontend bundle, so the desktop crate does not
      # compile until this has run. It doubles as the TypeScript typecheck.
      - name: Build frontend
        working-directory: apps/desktop
        run: |
          npm ci
          npm run build

      # Before the Rust steps, which take minutes. The frontend had neither of
      # these until now, which is how a react-hooks suppression sat in the tree
      # for the life of a file with no rule behind it to suppress.
      - name: Lint frontend
        working-directory: apps/desktop
        run: npm run lint

      - name: Test frontend
        working-directory: apps/desktop
        run: npm test

      - run: cargo fmt --all --check

      # `--locked` on everything that resolves dependencies. The supply-chain
      # job audits advisories and licences against Cargo.lock, so a build
      # allowed to resolve around the lockfile is a build nothing audited — and
      # a lockfile that has drifted should fail here loudly rather than be
      # silently updated by whichever job ran first.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - run: cargo test --workspace --locked

  # Crates that must build away from Windows, for different reasons.
  #
  # yara-core claims to be free of platform and UI entanglement, and that claim
  # is what keeps the part worth auditing small — a claim nothing enforces
  # decays, so this is what enforces it.
  #
  # yara-sync is the opposite case: Linux is where it actually runs, and the
  # Windows job proves nothing about the binary that ends up on the server.
  #
  # yara-broker, yara-cli and yara-mcp are Windows-only in what they *do* — the
  # transport is a named pipe — but not in what they need to *compile*: every
  # Windows-specific item is already behind its own `cfg(windows)`, on purpose,
  # so the rest of each crate stays checked on the platform most contributors
  # and CI itself run on. Two of those items were only ever referenced from
  # inside `cfg(windows)` code, so nothing off Windows flagged their imports
  # as unused until `-D warnings` was pointed at the crate directly — nobody
  # here had been doing that, which is how it went unnoticed.
  linux:
    name: Core, sync, and the platform-gated crates (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy -p yara-core -p yara-sync -p yara-broker -p yara-cli -p yara-mcp --all-targets --locked -- -D warnings

      - run: cargo test -p yara-core -p yara-sync -p yara-broker -p yara-cli -p yara-mcp --locked

  supply-chain:
    name: Advisories and licences
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # `bans` is in the list because deny.toml has a [bans] section, and a
      # section that never runs is a setting the file only appears to have:
      # `wildcards = "deny"` was dead configuration until this line named it.
      # Duplicate versions stay allowed there, so the one new way to fail is a
      # dependency pinned to `*`.
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources

  # Everything under deploy/ runs on the server and nowhere else, so without
  # this job its first execution is in production. None of these checks need a
  # server; they only need someone to have written them down.
  deploy:
    name: Deploy configuration
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # .gitattributes forces LF on .sh, .service and .timer because CRLF
      # genuinely breaks them — `#!/usr/bin/env bash\r` fails with "bad
      # interpreter", and systemd rejects a directive with a trailing carriage
      # return. Nothing checked that the tree agrees with that claim.
      - name: Nothing under deploy/ carries a carriage return
        run: |
          if grep -rlU $'\r' deploy/; then
            echo "::error::the files above must be LF-only; see .gitattributes"
            exit 1
          fi

      - name: Shell scripts
        run: shellcheck deploy/*.sh

      # The Caddyfile asks, in a comment, for `caddy fmt` before committing.
      # An instruction nothing enforces is a request, and this is the check
      # that makes it a rule. `--diff` exits non-zero when the file differs.
      - name: Caddyfile is formatted
        run: |
          docker run --rm -v "$PWD/deploy:/deploy" -w /deploy caddy:2-alpine \
            caddy fmt --diff Caddyfile

      # The image installs a released binary rather than compiling one, so
      # building it needs a version that has been released. Deliberately not the
      # version in Cargo.toml: on the pull request that bumps it, no release
      # carrying that version exists yet.
      - name: Resolve the newest released version
        id: released
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! tag="$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)"; then
            echo "::error::no published release to build the sync image against"
            exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"

      # `config` resolves env_file paths and fails on a missing one, and the
      # connector token deliberately lives at an absolute path on the server —
      # it is a secret, so it is not in the repository and never should be.
      #
      # So the runner is given an empty file at that path. Marking the entry
      # `required: false` in compose would also silence this and would be the
      # wrong fix: on the host a missing token must stop the stack, not start
      # cloudflared with no way in. What is being checked here is the shape of
      # the file, not the secrets of a deployment.
      - name: Compose file is valid
        env:
          YARA_VERSION: ${{ steps.released.outputs.version }}
        run: |
          sudo install -d /srv/yara/secrets
          sudo touch /srv/yara/secrets/tunnel.env
          docker compose -f deploy/docker-compose.yml config -q

      # Builds the image the origin runs, including the checksum check on the
      # downloaded binary — so a release whose .sha256 does not match its
      # artifact fails here rather than on the server.
      - name: Sync image builds
        run: |
          docker build deploy \
            --build-arg "YARA_VERSION=${{ steps.released.outputs.version }}" \
            --tag yara-sync:ci
