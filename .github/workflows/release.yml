name: Release

# Cut a release by pushing a tag:
#
#   git tag v0.1.1 && git push origin v0.1.1
#
# The tag is the version, and three files in the tree carry it as well. The
# `verify` job below refuses to let anything build unless all four agree,
# because tauri-action reads the config rather than the tag: a mismatch ships a
# manifest that no client will ever consider newer than what it already has,
# and the only symptom is that nobody is ever offered an update.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Read by default. The two jobs that create or attach release assets ask for
# write themselves, so the job that only reads three version numbers cannot
# publish anything.
permissions:
  contents: read

# Every third-party action here is pinned to a full commit SHA. A tag is a name
# its owner can move — `@v0` and `@stable` are retargeted routinely — and one of
# these actions runs in the same job as the update signing key. The trailing
# comment is what Dependabot reads to keep the pin current; see
# .github/dependabot.yml.

jobs:
  # Nothing is built, and nothing is signed, until the ref is a version tag and
  # that tag agrees with every version in the tree.
  #
  # The case this exists for is not a typo. `workflow_dispatch` accepts any ref
  # and the jobs below treat `github.ref_name` as a version, so dispatching from
  # main published a signed release tagged "main" — which the origin's
  # yara-manifest.timer mirrors within five minutes, pointing every install at a
  # manifest whose version is a branch name.
  verify:
    name: Tag matches the tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: The ref is a version tag and every version file agrees with it
        run: |
          case "$GITHUB_REF" in
            refs/tags/v*) ;;
            *)
              echo "::error::$GITHUB_REF is not a version tag. Release by pushing v<version>, not by dispatching from a branch."
              exit 1
              ;;
          esac

          version="${GITHUB_REF_NAME#v}"

          # tomllib rather than a grep: [workspace.dependencies] is full of
          # `version =` lines, and the one that matters is not the first.
          cargo_version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          package_version="$(jq -er .version apps/desktop/package.json)"
          tauri_version="$(jq -er .version apps/desktop/src-tauri/tauri.conf.json)"

          status=0
          check() {
            if [ "$2" != "$version" ]; then
              echo "::error file=$1::$1 says $2; the tag says $version"
              status=1
            fi
          }

          check Cargo.toml "$cargo_version"
          check apps/desktop/package.json "$package_version"
          check apps/desktop/src-tauri/tauri.conf.json "$tauri_version"

          if [ "$status" -ne 0 ]; then
            echo "::error::Bump every version to $version, or tag the version the tree actually holds."
            exit 1
          fi

          echo "Releasing $version."

  desktop:
    name: Desktop (Windows)
    runs-on: windows-latest
    needs: verify
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The npm cache stays, unlike the Rust one below. Its entries are content
      # addressed and `npm ci` checks each tarball against the integrity hash in
      # package-lock.json, so a poisoned entry does not survive installation.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-05
        with:
          toolchain: stable

      # There is deliberately no Rust build cache in this workflow. A cache
      # written by a run on the default branch is readable from a tag ref, so
      # any push to main could populate what gets mounted into the one job that
      # holds the signing key — and a target directory is unverified compiler
      # output, including build-script binaries that then run. A release is cut
      # rarely; a cold build costs minutes and removes that path entirely.

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      # This is the only place the signing key exists outside the maintainer's
      # machine. It is deliberately not available to any other workflow, and it
      # never reaches the server that distributes the result — the host serving
      # an update cannot produce one a client will accept.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tagName: ${{ github.ref_name }}
          releaseName: yara ${{ github.ref_name }}
          releaseDraft: false
          prerelease: false
          # Publishes latest.json alongside the installers. The origin mirrors
          # that asset rather than being pushed to — see docs/hosting.md.
          includeUpdaterJson: true
          # Point the manifest at the NSIS installer. MSI is built for anyone
          # deploying by policy, but it is not the update artifact.
          updaterJsonPreferNsis: true
          # Everything after the first `--` reaches cargo. `--locked` is what
          # makes the shipped binary the one cargo-deny audited: without it a
          # release quietly resolves newer dependencies than Cargo.lock names,
          # and the advisory and licence checks were run against a different
          # tree than the one users install.
          args: -- --locked

  # The server binary, built where it runs.
  #
  # Attached to the release rather than pushed anywhere. The origin mirrors the
  # update manifest automatically because a manifest is inert — a bad one still
  # cannot produce an update a client accepts. A binary is not inert, so
  # installing it stays a deliberate act by an operator over SSH.
  #
  # `needs: desktop` is not ordering for its own sake: tauri-action creates the
  # release that the upload below attaches to.
  sync:
    name: Sync service (Linux)
    # Pinned rather than `ubuntu-latest`, because the glibc this links against
    # is the floor for the image that runs it: deploy/Dockerfile wraps this
    # exact binary in ubuntu:24.04. Let the label float and a runner upgrade
    # produces a binary the container cannot start, failing with a symbol
    # version error that points at neither of the two files that disagree.
    runs-on: ubuntu-24.04
    needs: [verify, desktop]
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable, 2026-08-05
        with:
          toolchain: stable

      - run: cargo build -p yara-sync --release --locked

      - name: Name it for the platform it runs on
        run: |
          version="${GITHUB_REF_NAME#v}"
          install -m 0755 target/release/yara-sync "yara-sync-${version}-x86_64-linux"
          sha256sum "yara-sync-${version}-x86_64-linux" > "yara-sync-${version}-x86_64-linux.sha256"

      - name: Attach to the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" yara-sync-*-x86_64-linux yara-sync-*.sha256 --clobber
