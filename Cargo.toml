[workspace]
resolver = "2"
members = [
  "crates/yara-core",
  "crates/yara-broker",
  "crates/yara-cli",
  "crates/yara-mcp",
  "crates/yara-sync",
  "crates/yara-sync-client",
  "apps/desktop/src-tauri",
]

[workspace.package]
version = "0.2.1"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/sf0rzin/yara"

[workspace.dependencies]
yara-core = { path = "crates/yara-core" }
yara-broker = { path = "crates/yara-broker" }
yara-sync-client = { path = "crates/yara-sync-client" }

argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
data-encoding = "2"
ed25519-dalek = "2"
hkdf = "0.12"
hmac = "0.12"
image = { version = "0.25", default-features = false, features = [
  "bmp",
  "gif",
  "jpeg",
  "png",
  "webp",
] }
percent-encoding = "2"
rqrr = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = [
  "io-std",
  "io-util",
  "macros",
  "net",
  "process",
  "rt-multi-thread",
  "sync",
  "time",
] }
url = "2"
uuid = { version = "1", features = ["v4", "serde"] }
zeroize = { version = "1", features = ["derive"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
